<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Navbar</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" aria-current="page" href="index.html"
                  >Home</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="products.html">Products</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="services.html">Services</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="about.html">About us</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active bg-danger" href="contacts.html"
                  >Contacts</a
                >
              </li>
              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  Gallery
                </a>
                <ul class="dropdown-menu">
                  <li>
                    <a class="dropdown-item" href="photos.html">Photos</a>
                  </li>
                  <li>
                    <a class="dropdown-item" href="videos.html">Videos</a>
                  </li>
                </ul>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section>
        <div class="container">
          <div class="row">
            <div class="col-md-6 border border-black m-4 p-4">
              <form>
                <h2>Contact Form</h2>
                <div class="row mt-4">
                  <div class="col-md-6">
                    <label for="floatingInput">Full Name</label>
                    <input
                      type="text"
                      class="form-control"
                      id="floatingInput"
                      placeholder="Enter name"
                    />
                  </div>
                  <div class="col-md-6">
                    <label for="floatingInput">Email address</label>
                    <input
                      type="email"
                      class="form-control"
                      id="floatingInput"
                      placeholder="name@example.com"
                    />
                  </div>

                <div class="row mt-4">
                      <div class="col-md-3">
                        <label for="floatingInput">Phone Number</label>
                        <input
                          type="tel"
                          class="form-control"
                          id="floatingInput"
                          placeholder="Enter phone no"
                        />
                      </div>
                      <div class="col-md-6">
                        <div class="row">
                          <p>Select Gender</p>
                          <div class="col-md-5">
                            <input
                              class="form-check-input"
                              type="radio"
                              name="flexRadioDefault"
                              id="flexRadioDefault1"
                            />
                            <label
                              class="form-check-label"
                              for="flexRadioDefault1"
                            >
                              Male
                            </label>
                          </div>
                            
                          <div class="col-md-5">
                            <input
                              class="form-check-input"
                              type="radio"
                              name="flexRadioDefault"
                              id="flexRadioDefault1"
                            />
                            <label
                              class="form-check-label"
                              for="flexRadioDefault1"
                            >
                              Female
                            </label>
                          </div>

                    </div>
                    </div>
                    <div class="col-md-3">
                      <label for="floatingInput">Age</label>
                        <input
                          type="age"
                          class="form-control"
                          id="floatingInput"
                          placeholder="Enter Age">
                    </div>
                    </div>
                    </div>

                    <div class="row mt-4">

                      <div class="col-md-4">
                        <label for="floatingInput">Country Code</label>
                        <input
                          type="text"
                          class="form-control"
                          id="floatingInput"
                          placeholder="Countrycode">
                      </div>
                      <div class="col-md-4">
                        <p>Select State</p>
                        <select class="form-select" aria-label="Default select example">
  <option selected>Open this select menu</option>
  <option value="1">Maharashtra</option>
  <option value="2">Delhi</option>
  <option value="3">Kerla</option>
</select>
                      </div>
                      
                      <div class="col-md-4">
                         <p>Select Your City</p>
                        <select class="form-select" aria-label="Default select example">
  <option selected>Open this select menu</option>
  <option value="1">Pune</option>
  <option value="2">Mumbai</option>
  <option value="3">Nashik</option>
</select>
                      </div>
                    </div>

                    
                      <div class="mt-4"> 
                        <p class="input-group-text d-inline">Comments</p>
  <textarea class="form-control" aria-label="With textarea"></textarea></div>
                      
                  
              <div class="row">
                      <div class="col-md-12">
                        <input type="button" class="btn btn-primary mt-4" value="Submit">
                      </div>
                 </div>
                    
                  </div>
                </div>
              </form>
            </div>
           <div class="col-md-6">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d133629.98848261285!2d73.8569794653807!3d18.52069609998922!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc2bf2e67461101%3A0x828d43bf9d9ee343!2sPune%2C%20Maharashtra!5e0!3m2!1sen!2sin!4v1755850171665!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
